<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 1.5s linear infinite;
      }
      .shadow-subtle-grey {
        text-shadow: 0 4px 12px rgba(44, 47, 50, 0.15);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-container-lowest text-on-surface font-body min-h-screen flex flex-col justify-center items-center">
<!-- Splash Content Wrapper -->
<main class="relative flex flex-col items-center justify-between h-full w-full max-w-md py-24">
<!-- Center Logo Section -->
<div class="flex-grow flex items-center justify-center">
<div class="flex flex-col items-center">
<!-- Branding Anchor - The Logo -->
<h1 class="font-headline font-[900] text-[64px] tracking-[6px] text-on-surface shadow-subtle-grey">
                    MLT
                </h1>
<!-- Tagline using Design System Typography (Label Small) -->
<p class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant mt-4">
                    Mobility Reimagined
                </p>
</div>
</div>
<!-- Bottom Element: Loading Indicator -->
<div class="mt-auto flex flex-col items-center gap-6">
<!-- Spinner using Primary Indigo from Design System -->
<div class="relative w-12 h-12">
<div class="absolute inset-0 rounded-full border-[3px] border-surface-container-high"></div>
<div class="absolute inset-0 rounded-full border-[3px] border-primary border-t-transparent animate-spin-slow"></div>
</div>
<!-- Contextual Note -->
<span class="font-label text-xs font-medium text-outline tracking-tight">
                Initializing Secure Session
            </span>
</div>
</main>
<!-- Visual Texture Layers (The "Fluid Executive" Tonal Depth) -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<!-- Subtle Tonal Shift Gradient in the corner to break the flat white without using borders -->
<div class="absolute -top-[10%] -right-[10%] w-[50%] h-[50%] bg-gradient-to-br from-primary/5 to-transparent rounded-full blur-[100px]"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[40%] h-[40%] bg-gradient-to-tr from-secondary/5 to-transparent rounded-full blur-[80px]"></div>
</div>
